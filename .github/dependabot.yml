version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard:
        patterns: ["react", "react-dom", "react-router-dom", "@types/*", "vite", "@vitejs/*", "typescript", "@fontsource/*"]
      useclaudia:
        patterns: ["@useclaudia/*"]
    ignore:
      # TypeScript 7 (the native rewrite) breaks the dashboard build; stay on 5.x until it's migrated.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
