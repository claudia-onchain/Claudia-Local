version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard:
        patterns: ["react", "react-dom", "react-router-dom", "@types/*", "vite", "@vitejs/*", "typescript", "@fontsource/*"]
      useclaudia:
        patterns: ["@useclaudia/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
